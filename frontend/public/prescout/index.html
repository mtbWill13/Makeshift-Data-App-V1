<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prescouting | MakeShift Scouting Data Hub</title>
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="prescout.css" />
  </head>
  <body>
    <div class="top-bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <header>
      <div class="header-content">
        <a class="brand" href="/"><img src="/images/makeshift-logo-wide.png" alt="MakeShift 4039" width="707" height="78"></a>
        <div class="eyebrow">Analysis</div>
        <h1>Prescouting</h1>
        <p class="header-description">
          Paste the teams at an upcoming event to rank them by last season's
          performance and get a quick read on each one.
        </p>
        <div class="header-links"><a class="back-link" href="/">← Data Hub</a></div>
      </div>
    </header>
    <main>
      <section class="controls">
        <div class="control-group teams-control">
          <label for="teamsInput">Teams</label>
          <textarea id="teamsInput" rows="3" placeholder="e.g. 4039, 1114, 2056, 7558 (commas, spaces or new lines)"></textarea>
        </div>

        <div class="control-group">
          <label for="eventImport">Or import an event's team list</label>
          <div class="import-row">
            <input id="eventImport" type="text" placeholder="TBA event key, e.g. 2027onwat" autocomplete="off" spellcheck="false">
            <button id="importButton" class="secondary-button" type="button">Import</button>
          </div>
        </div>

        <div class="control-group">
          <label for="seasonSelect">Based on season</label>
          <select id="seasonSelect">
            <option value="2026" selected>2026</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
          </select>
        </div>

        <div class="button-row">
          <button id="prescoutButton" type="button">Prescout Teams</button>
          <p id="status" class="status" aria-live="polite"></p>
        </div>
      </section>

      <div id="results"></div>
    </main>
	<script src="/global.js"></script>
    <script src="prescout.js"></script>
  </body>
</html>
