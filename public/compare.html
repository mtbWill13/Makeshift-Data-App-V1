<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare Teams | MakeShift Scouting Data Hub</title>
  <style>
    :root { --red:#ff3c32; --orange:#f2b305; --yellow:#ffe11c; --green:#4cdb54; --cyan:#34aadc; --black:#000; --white:#fff; --light-gray:#f4f4f4; --mid-gray:#d9d9d9; --text-gray:#555; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--light-gray); color:var(--black); }
    .top-bar { height:10px; background:linear-gradient(to right,var(--red) 0 20%,var(--orange) 20% 40%,var(--yellow) 40% 60%,var(--green) 60% 80%,var(--cyan) 80%); }
    header { background:var(--black); color:var(--white); padding:42px 7vw 48px; }
    .header-content, main { max-width:1300px; margin:auto; }
    .eyebrow { font-size:.85rem; font-weight:bold; letter-spacing:.16em; text-transform:uppercase; color:var(--cyan); margin-bottom:12px; }
    h1 { margin:0; font-size:clamp(2.5rem,6vw,5.5rem); line-height:.95; letter-spacing:-.06em; }
    .header-description { margin:22px 0 0; max-width:650px; color:#cfcfcf; line-height:1.6; }
    .back-link, .compare-link { color:var(--cyan); font-weight:bold; text-decoration:none; }
    .back-link:hover, .compare-link:hover { text-decoration:underline; }
    main { padding:38px 7vw 80px; }
    .controls { display:grid; grid-template-columns:1.25fr 1fr 1fr auto; gap:18px; align-items:end; background:var(--white); border:2px solid var(--black); box-shadow:8px 8px 0 var(--black); padding:24px; }
    .control-group { display:flex; flex-direction:column; gap:8px; }
    label { font-size:.78rem; font-weight:bold; text-transform:uppercase; letter-spacing:.08em; }
    select,input,button { height:48px; border:2px solid var(--black); background:var(--white); padding:0 14px; font:inherit; }
    select:focus,input:focus { border-color:var(--cyan); box-shadow:4px 4px 0 var(--cyan); outline:none; }
    button { background:var(--red); font-weight:bold; cursor:pointer; padding:0 28px; }
    button:hover { transform:translate(-3px,-3px); box-shadow:5px 5px 0 var(--black); }
    #results { margin-top:52px; }
    .loading,.empty-state { background:var(--white); border:2px solid var(--black); padding:30px; font-size:1.1rem; font-weight:bold; text-align:center; }
    .comparison-heading { display:grid; grid-template-columns:1fr auto 1fr; align-items:end; gap:18px; margin-bottom:22px; }
    .team-name { margin:0; font-size:clamp(2rem,4vw,3.5rem); letter-spacing:-.05em; }
    .team-name.right { text-align:right; }
    .vs { color:var(--text-gray); font-size:.9rem; font-weight:bold; letter-spacing:.12em; }
    .team-detail { margin:8px 0 0; color:var(--text-gray); font-weight:bold; }
    .team-detail.right { text-align:right; }
    .section-title { margin:46px 0 16px; font-size:1.35rem; letter-spacing:.05em; text-transform:uppercase; border-bottom:3px solid var(--black); padding-bottom:10px; }
    .comparison-table { width:100%; border-collapse:collapse; background:var(--white); border:2px solid var(--black); }
    .comparison-table th,.comparison-table td { border:1px solid var(--mid-gray); padding:15px 18px; }
    .comparison-table thead th { background:var(--black); color:var(--white); font-size:.82rem; letter-spacing:.06em; text-transform:uppercase; }
    .comparison-table th:first-child { text-align:left; }
    .comparison-table td { font-size:1.15rem; font-weight:900; text-align:center; }
    .comparison-table td:first-child { color:var(--text-gray); font-size:.78rem; font-weight:bold; letter-spacing:.06em; text-align:left; text-transform:uppercase; }
    .winner { background:var(--green); }
    .summary { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .summary-card { border:2px solid var(--black); padding:22px; box-shadow:6px 6px 0 var(--black); }
    .summary-card:first-child { background:var(--cyan); } .summary-card:last-child { background:var(--yellow); }
    .summary-label { font-size:.8rem; font-weight:bold; letter-spacing:.08em; text-transform:uppercase; }
    .summary-value { font-size:clamp(2rem,4vw,3.8rem); font-weight:900; letter-spacing:-.06em; margin-top:12px; }
    .summary-note { margin-top:8px; font-size:.9rem; font-weight:bold; }
    @media (max-width:800px) { .controls { grid-template-columns:1fr; } .comparison-heading { grid-template-columns:1fr; text-align:center; } .team-name.right,.team-detail.right { text-align:center; } .vs { order:1; } .comparison-table th,.comparison-table td { padding:12px 8px; } .comparison-table td { font-size:1rem; } .summary { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="top-bar"></div>
  <header>
    <div class="header-content">
      <div class="eyebrow">MakeShift Robotics • FRC 4039</div>
      <h1>Team<br>Comparison</h1>
      <p class="header-description">Compare two teams’ event performance, scouting results, and pit information side by side.</p>
      <p><a class="back-link" href="/">← Back to Scouting Data Hub</a></p>
    </div>
  </header>
  <main>
    <section class="controls">
      <div class="control-group"><label for="eventKey">Event</label><select id="eventKey"><option value="2026onham">McMaster</option><option value="2026onosh">Durham College</option><option value="2026onwat">Waterloo</option><option value="2026oncmp2" selected>Provincials Technology Division</option><option value="2026oncmp1">Provincials Science Division</option><option value="2026ontor">Humber</option><option value="2026onwin">Windsor</option></select></div>
      <div class="control-group"><label for="teamA">Team A</label><input id="teamA" type="number" inputmode="numeric" placeholder="e.g. 4039"></div>
      <div class="control-group"><label for="teamB">Team B</label><input id="teamB" type="number" inputmode="numeric" placeholder="e.g. 1114"></div>
      <button id="compareButton">Compare</button>
    </section>
    <div id="results"><div class="empty-state">Choose an event, enter two team numbers, then select Compare.</div></div>
  </main>
  <script>
    const eventSelect = document.getElementById('eventKey');
    const teamAInput = document.getElementById('teamA');
    const teamBInput = document.getElementById('teamB');
    const compareButton = document.getElementById('compareButton');
    const results = document.getElementById('results');

    function escapeHtml(value) { return String(value ?? '—').replace(/[&<>'"]/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[character]); }
    function averageColumn(rows, columnName) { const values = rows.filter(row => String(row['No Show'] ?? '').trim().toUpperCase() !== 'TRUE').map(row => Number(String(row[columnName] ?? '').trim())).filter(Number.isFinite); return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : null; }
    function truePercentage(rows, columnName) { const answers = rows.map(row => String(row[columnName] ?? '').trim().toUpperCase()).filter(value => value === 'TRUE' || value === 'FALSE'); return answers.length ? answers.filter(value => value === 'TRUE').length / answers.length * 100 : null; }
    function firstTextValue(rows, columnName) { return rows.map(row => String(row[columnName] ?? '').trim()).find(Boolean) ?? null; }
    function consistencyScore(rows, columnName, minScore = 1, maxScore = 5) {
      const scores = rows
        .filter(row => String(row['No Show'] ?? '').trim().toUpperCase() !== 'TRUE')
        .map(row => Number(row[columnName]))
        .filter(Number.isFinite);
      if (scores.length < 2) return null;
      const average = scores.reduce((sum, score) => sum + score, 0) / scores.length;
      const variance = scores.reduce((sum, score) => sum + (score - average) ** 2, 0) / scores.length;
      const maximumDeviation = (maxScore - minScore) / 2;
      return Math.max(0, Math.min(100, 100 * (1 - Math.sqrt(variance) / maximumDeviation)));
    }
    function formatNumber(value, digits = 1) { return Number.isFinite(value) ? value.toFixed(digits) : '—'; }
    async function fetchJson(url) { const response = await fetch(url); const text = await response.text(); let data; try { data = JSON.parse(text); } catch { throw new Error(`${url} returned an invalid response.`); } if (!response.ok) throw new Error(data.error || `Could not load ${url}.`); return data; }
    async function fetchStatbotics(teamNumber, eventKey) {
      try {
        return await fetchJson(`/api/statbotics/team-event/${teamNumber}/${eventKey}`);
      } catch (error) {
        console.warn(`EPA is unavailable for team ${teamNumber}:`, error.message);
        return null;
      }
    }

    function buildProfile(teamNumber, data) {
      const key = `frc${teamNumber}`;
      const team = data.teams[key] || {};
      const statbotics = data.statbotics;
      const scoutingRows = data.scouting.filter(row => String(row['Team Number'] ?? '').trim() === teamNumber);
      const pitRows = data.pit.filter(row => String(row['Team Number of Team Being Scouted'] ?? row['Team Number'] ?? '').trim() === teamNumber);
      return {
        number: teamNumber, opr: Number(team.opr), dpr: Number(team.dpr), ccwm: Number(team.ccwm), matches: team.matches || 0,
        totalEpa: Number(statbotics?.epa?.total_points?.mean), autoEpa: Number(statbotics?.epa?.breakdown?.auto_points), teleopEpa: Number(statbotics?.epa?.breakdown?.teleop_points),
        auto: averageColumn(scoutingRows, 'Auto Scoring Points'), teleop: averageColumn(scoutingRows, 'Teleop Scoring Points'),
        defense: averageColumn(scoutingRows, 'Defense Rating from 1 (incredible) to 5 (poor)'), defenseConsistency: consistencyScore(scoutingRows, 'Defense Rating from 1 (incredible) to 5 (poor)'), defended: truePercentage(scoutingRows, 'Robot was defended'),
        scoutingCount: scoutingRows.length, drive: firstTextValue(pitRows, 'What type of drive base does your robot have?'),
        start: firstTextValue(pitRows, 'Preferred Starting Location'), trench: firstTextValue(pitRows, 'Can your robot drive under the trench?'),
        bump: firstTextValue(pitRows, 'Can your robot drive over the bump?'), defenseOpen: firstTextValue(pitRows, 'If strategy required; would you be open to playing defense?'),
        language: firstTextValue(pitRows, 'What language is your robot programmed in?')
      };
    }

    function numericRow(label, a, b, options = {}) {
      const { digits = 1, lowerIsBetter = false, suffix = '' } = options;
      const aValue = Number.isFinite(a) ? a : null; const bValue = Number.isFinite(b) ? b : null;
      const aWins = aValue !== null && bValue !== null && aValue !== bValue && (lowerIsBetter ? aValue < bValue : aValue > bValue);
      const bWins = aValue !== null && bValue !== null && aValue !== bValue && (lowerIsBetter ? bValue < aValue : bValue > aValue);
      return `<tr><td>${label}</td><td class="${aWins ? 'winner' : ''}">${formatNumber(aValue, digits)}${aValue === null ? '' : suffix}</td><td class="${bWins ? 'winner' : ''}">${formatNumber(bValue, digits)}${bValue === null ? '' : suffix}</td></tr>`;
    }
    function textRow(label, a, b) { return `<tr><td>${label}</td><td>${escapeHtml(a)}</td><td>${escapeHtml(b)}</td></tr>`; }

    function renderComparison(a, b) {
      const aTotal = Number.isFinite(a.auto) && Number.isFinite(a.teleop) ? a.auto + a.teleop : null;
      const bTotal = Number.isFinite(b.auto) && Number.isFinite(b.teleop) ? b.auto + b.teleop : null;
      const aEdge = [a.opr, a.ccwm, aTotal].filter(Number.isFinite).reduce((sum, value) => sum + value, 0);
      const bEdge = [b.opr, b.ccwm, bTotal].filter(Number.isFinite).reduce((sum, value) => sum + value, 0);
      const summary = aEdge === bEdge ? 'Even' : aEdge > bEdge ? `Team ${a.number}` : `Team ${b.number}`;
      results.innerHTML = `
        <div class="comparison-heading"><div><h2 class="team-name">Team ${escapeHtml(a.number)}</h2><p class="team-detail">${a.scoutingCount} scouting reports</p></div><div class="vs">VS</div><div><h2 class="team-name right">Team ${escapeHtml(b.number)}</h2><p class="team-detail right">${b.scoutingCount} scouting reports</p></div></div>
        <section class="summary"><div class="summary-card"><div class="summary-label">Comparison edge</div><div class="summary-value">${summary}</div><div class="summary-note">Based on available OPR, CCWM, and scouting scoring data.</div></div><div class="summary-card"><div class="summary-label">Event</div><div class="summary-value">${escapeHtml(eventSelect.selectedOptions[0].text)}</div><div class="summary-note">Green cells indicate the stronger numeric value.</div></div></section>
        <h3 class="section-title">Event performance</h3>
        <table class="comparison-table"><thead><tr><th>Stat</th><th>Team ${escapeHtml(a.number)}</th><th>Team ${escapeHtml(b.number)}</th></tr></thead><tbody>
          ${numericRow('OPR', a.opr, b.opr, {digits:2})}${numericRow('DPR', a.dpr, b.dpr, {digits:2, lowerIsBetter:true})}${numericRow('CCWM', a.ccwm, b.ccwm, {digits:2})}${numericRow('Total EPA', a.totalEpa, b.totalEpa)}${numericRow('Auto EPA', a.autoEpa, b.autoEpa)}${numericRow('Teleop EPA', a.teleopEpa, b.teleopEpa)}${numericRow('Matches played', a.matches, b.matches, {digits:0})}
        </tbody></table>
        <h3 class="section-title">Match scouting</h3>
        <table class="comparison-table"><thead><tr><th>Stat</th><th>Team ${escapeHtml(a.number)}</th><th>Team ${escapeHtml(b.number)}</th></tr></thead><tbody>
          ${numericRow('Average auto points', a.auto, b.auto)}${numericRow('Average teleop points', a.teleop, b.teleop)}${numericRow('Average total points', aTotal, bTotal)}${numericRow('Defense rating', a.defense, b.defense, {lowerIsBetter:true})}${numericRow('Defense consistency', a.defenseConsistency, b.defenseConsistency, {suffix:'%'})}${numericRow('Was Defended in matches', a.defended, b.defended, {suffix:'%'})}${numericRow('Scouting reports', a.scoutingCount, b.scoutingCount, {digits:0})}
        </tbody></table>
        <h3 class="section-title">Pit scouting</h3>
        <table class="comparison-table"><thead><tr><th>Stat</th><th>Team ${escapeHtml(a.number)}</th><th>Team ${escapeHtml(b.number)}</th></tr></thead><tbody>
          ${textRow('Drive base', a.drive, b.drive)}${textRow('Preferred start', a.start, b.start)}${textRow('Can pass trench', a.trench, b.trench)}${textRow('Can cross bump', a.bump, b.bump)}${textRow('Open to defense', a.defenseOpen, b.defenseOpen)}${textRow('Programming language', a.language, b.language)}
        </tbody></table>`;
    }

    async function compareTeams() {
      const eventKey = eventSelect.value; const teamA = teamAInput.value.trim(); const teamB = teamBInput.value.trim();
      if (!teamA || !teamB) { results.innerHTML = '<div class="empty-state">Enter two team numbers to compare.</div>'; return; }
      if (teamA === teamB) { results.innerHTML = '<div class="empty-state">Choose two different teams.</div>'; return; }
      results.innerHTML = '<div class="loading">Loading team comparison…</div>';
      try {
        const [matches, rankings, stats, scouting, pit, statboticsA, statboticsB] = await Promise.all([
          fetchJson(`/api/events/${eventKey}/matches`), fetchJson(`/api/events/${eventKey}/rankings`), fetchJson(`/api/events/${eventKey}/oprs`), fetchJson(`/api/scouting/${eventKey}`), fetchJson(`/api/pitscouting/${eventKey}`), fetchStatbotics(teamA, eventKey), fetchStatbotics(teamB, eventKey)
        ]);
        const teams = {};
        for (const [teamKey, opr] of Object.entries(stats.oprs || {})) teams[teamKey] = { ...(teams[teamKey] || {}), opr, dpr:stats.dprs?.[teamKey], ccwm:stats.ccwms?.[teamKey], matches:0 };
        for (const ranking of Array.isArray(rankings) ? rankings : []) teams[ranking.team_key] = { ...(teams[ranking.team_key] || {matches:0}), rank:ranking.rank };
        for (const match of Array.isArray(matches) ? matches : []) for (const key of [...(match.red?.team_keys || []), ...(match.blue?.team_keys || [])]) teams[key] = { ...(teams[key] || {matches:0}), matches:(teams[key]?.matches || 0) + 1 };
        renderComparison(buildProfile(teamA, {teams, scouting, pit, statbotics: statboticsA}), buildProfile(teamB, {teams, scouting, pit, statbotics: statboticsB}));
      } catch (error) { results.innerHTML = `<div class="empty-state">Could not load comparison: ${escapeHtml(error.message)}</div>`; }
    }
    compareButton.addEventListener('click', compareTeams);
    [teamAInput, teamBInput].forEach(input => input.addEventListener('keydown', event => { if (event.key === 'Enter') compareTeams(); }));
  </script>
</body>
</html>
