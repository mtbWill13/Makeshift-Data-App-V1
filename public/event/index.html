<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Rankings | MakeShift Scouting Data Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="top-bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <header>
      <div class="header-content">
        <a class="brand" href="/"><img src="/images/makeshift-logo-wide.png" alt="MakeShift 4039" width="707" height="78"></a>
        <div class="eyebrow">Analysis</div>
        <h1>Event<br>Rankings</h1>
        <p class="header-description">Compare every team at an event by OPR, scouting average, and EPA.</p>
        <div class="header-links"><a class="back-link" href="/">← Data Hub</a></div>
      </div>
    </header>
    <main>
      <section class="controls">
        <label for="eventKey">Event
          <select id="eventKey">
            <option value="2026onham">McMaster</option>
            <option value="2026onosh">Durham College</option>
            <option value="2026onwat">Waterloo</option>
            <option value="2026oncmp2" selected>Provincials Technology Division</option>
            <option value="2026oncmp1">Provincials Science Division</option>
            <option value="2026ontor">Humber</option>
            <option value="2026onwin">Windsor</option>
            <option value="2026test">Test Event</option>
          </select>
        </label>
        <label for="sortBy">Sort by
          <select id="sortBy">
            <option value="rank">Rank</option>
            <option value="opr">OPR</option>
            <option value="scouting">Scouting average</option>
            <option value="epa">EPA</option>
          </select>
        </label>
        <button id="loadButton" type="button">Load Event</button>
      </section>
      <p id="status" class="status" aria-live="polite"></p>
      <section id="teamList" class="team-list" aria-live="polite"></section>
    </main>
	<script src="/global.js"></script>
    <script src="index.js"></script>
  </body>
</html>
