<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTC Practice Tracker | MakeShift Scouting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/team.css">
    <link rel="stylesheet" href="/overview/overview.css">
    <link rel="stylesheet" href="/ftc/ftc.css">
    <link rel="stylesheet" href="/ftc/overview/practice/practice.css">
  </head>
  <body>
    <div class="top-bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <header>
      <div class="header-content">
        <a class="brand" href="/"><img src="/images/makeshift-logo-wide.png" alt="MakeShift 4039" width="707" height="78"></a>
        <div class="eyebrow">FTC Analysis</div>
        <h1>Practice<br>Tracker</h1>
        <p class="header-description">How our drive practice is going: points per run, who drove and operated, and whether we're improving.</p>
        <div class="header-links">
          <a class="back-link" href="/ftc/">← FTC Data Hub</a>
          <a class="back-link" href="/ftc/overview/">Event overview</a>
          <a class="back-link" href="/ftc/practice/">Log a run →</a>
        </div>
      </div>
    </header>

    <main>
      <section class="controls practice-controls">
        <label for="seasonSelect">Season<select id="seasonSelect"></select></label>
        <label for="driverFilter">Driver<select id="driverFilter"><option value="">Everyone</option></select></label>
        <label for="operatorFilter">Operator<select id="operatorFilter"><option value="">Everyone</option></select></label>
        <label for="lastFilter">Show<select id="lastFilter">
          <option value="all">All runs</option>
          <option value="10">Last 10 runs</option>
          <option value="20">Last 20 runs</option>
        </select></label>
      </section>

      <section id="summary" class="overview-summary"></section>

      <h2 class="section-title">Graphs</h2>
      <section id="graphs" class="overview-grid"><div class="loading">Loading practice runs…</div></section>

      <h2 class="section-title">Every run</h2>
      <div id="table" class="practice-table-wrap"></div>

      <section class="source-actions">
        <a id="exportCsv" class="back-link" href="#">Download practice log (CSV)</a>
        <a id="openSheet" class="back-link" href="#" target="_blank" rel="noopener noreferrer" hidden>Open the Google Sheet (Practice tab) ↗</a>
      </section>
    </main>

    <script src="/global.js"></script>
    <script src="/ftc/ftc-common.js"></script>
    <script src="/overview/charts.js"></script>
    <script src="/ftc/overview/practice/ftc-practice-overview.js"></script>
  </body>
</html>
