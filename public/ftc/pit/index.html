<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTC Pit Scouting | MakeShift Scouting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/team.css">
    <link rel="stylesheet" href="/ftc/ftc.css">
    <link rel="stylesheet" href="/ftc/ftc-scout.css">
  </head>
  <body>
    <div class="top-bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <header>
      <div class="header-content">
        <a class="brand" href="/"><img src="/images/makeshift-logo-wide.png" alt="MakeShift 4039" width="707" height="78"></a>
        <div class="eyebrow">FTC Scouting</div>
        <h1>FTC Pit<br>Scouting</h1>
        <p class="header-description">Talk to the team and look at the robot: what it can do, where it shoots from and how its auto starts.</p>
        <div class="header-links">
          <a class="back-link" href="/ftc/">← FTC Data Hub</a>
          <a class="back-link" href="/ftc/scouting/">Match scouting →</a>
          <a class="back-link" href="/ftc/overview/">Event overview →</a>
          <a class="back-link" href="https://ftc-resources.firstinspires.org/ftc/game/manual" target="_blank" rel="noopener noreferrer">Game manual ↗</a>
        </div>
      </div>
    </header>

    <main class="scout-shell">
      <section class="scout-section">
        <h2>Event and team</h2>
        <div class="setup-grid">
          <label for="seasonSelect">Season<select id="seasonSelect"></select></label>
          <label for="eventSelect">Event<select id="eventSelect"><option>Loading events…</option></select></label>
          <label for="customEvent">Event code not listed?<input id="customEvent" type="text" maxlength="20" placeholder="e.g. CAONBOQ" autocomplete="off"></label>
          <label for="scoutName">Your name<input id="scoutName" type="text" maxlength="40" autocomplete="name" placeholder="So we know who scouted"></label>
          <label for="teamNumber">Team number<input id="teamNumber" type="number" inputmode="numeric" min="1" max="99999" placeholder="e.g. 19502"></label>
        </div>
        <p id="teamNote" class="setup-note" aria-live="polite"></p>
        <p id="sheetNote" class="setup-note"></p>
      </section>

      <p id="queueNote" class="queue-note" hidden></p>
      <p id="formStatus" class="setup-note" aria-live="polite">Loading the questions…</p>

      <form id="pitForm" class="scout-shell" novalidate hidden>
        <div id="sections" class="scout-shell"></div>
        <label class="flag-row"><input type="checkbox" id="messedUp"><span>I think I messed this up, please double check.</span></label>
        <div class="form-actions">
          <button id="submitButton" type="submit">Submit pit report</button>
          <a class="transfer-button" id="transferButton" href="/ftc/transfer/">Save &amp; Offline Transfer</a>
        </div>
      </form>
    </main>

    <script src="/global.js"></script>

    <script src="/ftc/ftc-common.js"></script>
    <script src="/ftc/ftc-scout.js"></script>
    <script src="/ftc/pit/ftc-pit.js"></script>
  </body>
</html>
