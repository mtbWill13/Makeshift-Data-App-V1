<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FTC Compare Alliances | MakeShift Scouting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/alliance/alliance.css" />
    <link rel="stylesheet" href="/ftc/ftc.css" />
  </head>
  <body>
    <div class="top-bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <header>
      <div class="header-content">
        <a class="brand" href="/"><img src="/images/makeshift-logo-wide.png" alt="MakeShift 4039" width="707" height="78"></a>
        <div class="eyebrow">FTC Analysis</div>
        <h1>FTC Alliance<br />Comparison</h1>
        <p class="header-description">
          Enter two teams on each side to project an FTC match-up from
          season or event OPR.
        </p>
        <div class="header-links">
          <a class="back-link" href="/ftc/">← FTC Data Hub</a>
          <a class="back-link" href="/">FRC Data Hub</a>
        </div>
      </div>
    </header>
    <main>
      <section class="controls ftc-alliance">
        <div class="event-control ftc-scope">
          <div class="control-group">
            <label for="seasonSelect">Season</label>
            <select id="seasonSelect"></select>
          </div>
          <div class="control-group">
            <label for="eventSelect">Event</label>
            <select id="eventSelect"><option>Loading events…</option></select>
          </div>
        </div>
        <section class="alliance-inputs red">
          <h2>Red Alliance</h2>
          <div class="team-inputs">
            <div class="control-group">
              <label for="red1">Team 1</label><input id="red1" type="number" inputmode="numeric" placeholder="e.g. 19498" />
            </div>
            <div class="control-group">
              <label for="red2">Team 2</label><input id="red2" type="number" inputmode="numeric" placeholder="e.g. 9999" />
            </div>
          </div>
        </section>
        <section class="alliance-inputs blue">
          <h2>Blue Alliance</h2>
          <div class="team-inputs">
            <div class="control-group">
              <label for="blue1">Team 1</label><input id="blue1" type="number" inputmode="numeric" placeholder="e.g. 16417" />
            </div>
            <div class="control-group">
              <label for="blue2">Team 2</label><input id="blue2" type="number" inputmode="numeric" placeholder="e.g. 19532" />
            </div>
          </div>
        </section>
        <div class="button-row">
          <button id="compareButton" type="button">Compare Alliances</button>
        </div>
      </section>
      <div id="results">
        <div class="empty-state">Enter two teams for each alliance, then select Compare Alliances.</div>
      </div>
    </main>
    <script src="/ftc/ftc-common.js"></script>
    <script src="/ftc/alliance/ftc-alliance.js"></script>
  </body>
</html>
