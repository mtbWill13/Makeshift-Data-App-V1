<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FTC Prescouting | MakeShift Scouting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/prescout/prescout.css" />
    <link rel="stylesheet" href="/ftc/ftc.css" />
  </head>
  <body class="ftc-prescout">
    <div class="top-bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <header>
      <div class="header-content">
        <a class="brand" href="/"><img src="/images/makeshift-logo-wide.png" alt="MakeShift 4039" width="707" height="78"></a>
        <div class="eyebrow">FTC Analysis</div>
        <h1>FTC Prescouting</h1>
        <p class="header-description">
          Paste the FTC teams at an upcoming event to rank them by last
          season's OPR and get a quick read on each one.
        </p>
        <div class="header-links">
          <a class="back-link" href="/ftc/">← FTC Data Hub</a>
          <a class="back-link" href="/">FRC Data Hub</a>
        </div>
      </div>
    </header>
    <main>
      <section class="controls">
        <div class="control-group teams-control">
          <label for="teamsInput">FTC Teams</label>
          <textarea id="teamsInput" rows="3" placeholder="e.g. 19498, 9999, 16417 (commas, spaces or new lines)"></textarea>
        </div>

        <div class="control-group">
          <label for="eventImport">Or import an Ontario event's teams</label>
          <div class="import-row">
            <select id="eventImport"><option value="">Loading events…</option></select>
            <button id="importButton" class="secondary-button" type="button">Import</button>
          </div>
        </div>

        <div class="control-group">
          <label for="seasonSelect">Based on season</label>
          <select id="seasonSelect"></select>
        </div>

        <div class="button-row">
          <button id="prescoutButton" type="button">Prescout Teams</button>
          <p id="status" class="status" aria-live="polite"></p>
        </div>
      </section>

      <div id="results"></div>
    </main>
    <script src="/ftc/ftc-common.js"></script>
    <script src="/ftc/prescout/ftc-prescout.js"></script>
  </body>
</html>
