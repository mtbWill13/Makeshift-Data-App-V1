<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTC Event Rankings | MakeShift Scouting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/event/styles.css">
    <link rel="stylesheet" href="/ftc/ftc.css">
  </head>
  <body>
    <div class="top-bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <header>
      <div class="header-content">
        <a class="brand" href="/"><img src="/images/makeshift-logo-wide.png" alt="MakeShift 4039" width="707" height="78"></a>
        <div class="eyebrow">FTC Analysis</div>
        <h1>FTC Event<br>Rankings</h1>
        <p class="header-description">Every team at an FTC event, ranked by event rank or OPR.</p>
        <div class="header-links">
          <a class="back-link" href="/ftc/">← FTC Data Hub</a>
          <a class="back-link" href="/">FRC Data Hub</a>
        </div>
      </div>
    </header>
    <main>
      <section class="controls ftc-controls">
        <label for="seasonSelect">Season
          <select id="seasonSelect"></select>
        </label>
        <label for="eventSelect">Event
          <select id="eventSelect"><option>Loading events…</option></select>
        </label>
        <label for="sortBy">Sort by
          <select id="sortBy">
            <option value="rank">Event rank</option>
            <option value="opr">OPR</option>
            <option value="auto">Auto OPR</option>
            <option value="teleop">Teleop OPR</option>
            <option value="rp">Average RP</option>
            <option value="avg">Average score</option>
          </select>
        </label>
        <button id="loadButton" type="button">Load Event</button>
      </section>
      <p id="status" class="status" aria-live="polite"></p>
      <section id="teamList" class="team-list" aria-live="polite"></section>
      <p class="ftc-source-note">Data from FTCScout. OPR excludes penalty points.</p>
    </main>
    <script src="/ftc/ftc-common.js"></script>
    <script src="/ftc/event/ftc-event.js"></script>
  </body>
</html>
