<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FTC Compare Teams | MakeShift Scouting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/compare/compare.css" />
    <link rel="stylesheet" href="/index/index.css" />
    <link rel="stylesheet" href="/ftc/ftc.css" />
  </head>
  <body>
    <div class="top-bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <header>
      <div class="header-content">
        <a class="brand" href="/"><img src="/images/makeshift-logo-wide.png" alt="MakeShift 4039" width="707" height="78"></a>
        <div class="eyebrow">FTC Analysis</div>
        <h1>FTC Team<br />Comparison</h1>
        <p class="header-description">Compare two FTC teams across a whole season or at one event.</p>
        <div class="header-links">
          <a class="back-link" href="/ftc/">← FTC Data Hub</a>
          <a class="back-link" href="/">FRC Data Hub</a>
        </div>
      </div>
    </header>
    <main>
      <section class="controls ftc-compare-controls">
        <div class="control-group">
          <label for="seasonSelect">Season</label>
          <select id="seasonSelect"></select>
        </div>
        <div class="control-group">
          <label for="eventSelect">Event</label>
          <select id="eventSelect"><option>Loading events…</option></select>
        </div>
        <div class="control-group">
          <label for="teamA">Team A</label>
          <input id="teamA" type="number" inputmode="numeric" placeholder="e.g. 19498" />
        </div>
        <div class="control-group">
          <label for="teamB">Team B</label>
          <input id="teamB" type="number" inputmode="numeric" placeholder="e.g. 9999" />
        </div>
        <button id="compareButton" type="button">Compare</button>
      </section>
      <div id="results">
        <div class="empty-state">Choose a season or event, enter two FTC team numbers, then select Compare.</div>
      </div>
    </main>
    <script src="/ftc/ftc-common.js"></script>
    <script src="/ftc/compare/ftc-compare.js"></script>
  </body>
</html>
