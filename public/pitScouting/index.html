<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pit Scouting | MakeShift Scouting Data Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="top-bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <header>
      <div class="header-content">
        <a class="brand" href="/"><img src="/images/makeshift-logo-wide.png" alt="MakeShift 4039" width="707" height="78"></a>
        <div class="eyebrow">Scouting</div>
        <h1>Pit<br>Scouting</h1>
        <p class="header-description">Record robot capabilities and strategy details directly into the event’s pit-scouting sheet.</p>
		<div class="header-links">
          <a class="back-link" href="/">← Data Hub</a>
          <a class="back-link" href="/transfer/">Offline Transfer →</a>
        </div>
      </div>
    </header>

    <main>
      <section class="form-shell">
        <div class="event-row">
          <div class="control-group">
            <label for="eventKey">Event</label>
            <select id="eventKey">
              <option value="2026oncmp2">Provincials Technology Division</option>
              <option value="2026ontor">Humber</option>
              <option value="2026onwin">Windsor</option>
              <option value="2026test" selected>Test Event</option>
            </select>
          </div>
          <div class="control-group">
            <label for="submissionToken">Scout passcode</label>
            <input id="submissionToken" type="password" autocomplete="off" required>
          </div>
        </div>

        <p id="formStatus" class="status" aria-live="polite">Choose an event to load its pit-scouting form.</p>
        <form id="pitScoutingForm" hidden>
          <div id="formFields" class="form-fields"></div>
          <button id="submitButton" type="submit">Submit Pit Scouting</button>
        </form>
      </section>
    </main>
    <script src="/offline.js"></script>
	<script src="/global.js"></script>
    <script src="index.js"></script>
  </body>
</html>
