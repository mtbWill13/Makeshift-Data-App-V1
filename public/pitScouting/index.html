<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pit Scouting | MakeShift Scouting Data Hub</title>
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/team.css">
    <link rel="stylesheet" href="/scout-ui.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="top-bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <header>
      <div class="header-content">
        <a class="brand" href="/"><img src="/images/makeshift-logo-wide.png" alt="MakeShift 4039" width="707" height="78"></a>
        <div class="eyebrow">Scouting</div>
        <h1>Pit<br>Scouting</h1>
        <p class="header-description">Record robot capabilities and strategy details directly into the event’s pit-scouting sheet.</p>
		<div class="header-links">
          <a class="back-link" href="/">← Data Hub</a>
          <a class="back-link" href="/transfer/">Offline Transfer →</a>
        </div>
      </div>
    </header>

    <main>
      <section class="form-shell">
        <div class="event-row">
          <div class="control-group">
            <label for="eventKey">Event</label>
            <select id="eventKey">
              <option value="2026oncmp2">Provincials Technology Division</option>
              <option value="2026ontor">Humber</option>
              <option value="2026onwin">Windsor</option>
              <option value="2026onsi">Southwest International</option>
              <option value="2026test" selected>Test Event</option>
            </select>
          </div>
        </div>

        <p id="formStatus" class="status" aria-live="polite">Choose an event to load its pit-scouting form.</p>
        <p id="queueNote" class="queue-note" hidden></p>
        <form id="pitScoutingForm" hidden novalidate>
          <div id="formFields" class="form-fields"></div>
          <label class="flag-row"><input type="checkbox" id="messedUp"><span>I think I messed this up, please double check.</span></label>
          <div class="form-actions">
            <button id="submitButton" type="submit">Submit Pit Scouting</button>
            <a class="transfer-button" href="/transfer/">Offline Transfer</a>
          </div>
        </form>
      </section>
    </main>
    <script src="/offline.js"></script>
	<script src="/global.js"></script>
    <script src="/scout-ui.js"></script>
    <script src="/event-lists.js"></script>
    <script src="index.js"></script>
  </body>
</html>
