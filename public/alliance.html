<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare Alliances | MakeShift Scouting Data Hub</title>
  <style>
    :root { --red:#ff3c32; --orange:#f2b305; --yellow:#ffe11c; --green:#4cdb54; --cyan:#34aadc; --black:#000; --white:#fff; --light-gray:#f4f4f4; --mid-gray:#d9d9d9; --text-gray:#555; }
    * { box-sizing:border-box; } body { margin:0; background:var(--light-gray); color:var(--black); font-family:Arial,Helvetica,sans-serif; }
    .top-bar { height:10px; background:linear-gradient(to right,var(--red) 0 20%,var(--orange) 20% 40%,var(--yellow) 40% 60%,var(--green) 60% 80%,var(--cyan) 80%); }
    header { background:var(--black); color:var(--white); padding:42px 7vw 48px; } .header-content,main { max-width:1300px; margin:auto; }
    .eyebrow { color:var(--cyan); font-size:.85rem; font-weight:bold; letter-spacing:.16em; text-transform:uppercase; margin-bottom:12px; } h1 { margin:0; font-size:clamp(2.5rem,6vw,5.5rem); letter-spacing:-.06em; line-height:.95; }
    .header-description { color:#cfcfcf; line-height:1.6; max-width:650px; margin:22px 0; } .back-link { color:var(--cyan); font-weight:bold; text-decoration:none; } .back-link:hover { text-decoration:underline; }
    main { padding:38px 7vw 80px; } .controls { background:var(--white); border:2px solid var(--black); box-shadow:8px 8px 0 var(--black); padding:24px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:22px; }
    .event-control { grid-column:1 / -1; max-width:420px; } .alliance-inputs { border:2px solid var(--black); padding:18px; } .alliance-inputs.red { border-top:10px solid var(--red); } .alliance-inputs.blue { border-top:10px solid var(--cyan); }
    .alliance-inputs { min-width:0; } .alliance-inputs h2 { margin:0 0 16px; font-size:1.2rem; text-transform:uppercase; letter-spacing:.06em; } .team-inputs { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .control-group { display:flex; flex-direction:column; gap:8px; } label { font-size:.78rem; font-weight:bold; letter-spacing:.08em; text-transform:uppercase; } select,input,button { height:48px; border:2px solid var(--black); background:var(--white); font:inherit; padding:0 14px; }
    select:focus,input:focus { border-color:var(--cyan); box-shadow:4px 4px 0 var(--cyan); outline:none; } .team-inputs input { min-width:0; width:100%; } .button-row { grid-column:1 / -1; } button { background:var(--red); cursor:pointer; font-weight:bold; padding:0 28px; } button:hover { box-shadow:5px 5px 0 var(--black); transform:translate(-3px,-3px); }
    #results { margin-top:52px; } .loading,.empty-state { background:var(--white); border:2px solid var(--black); font-size:1.1rem; font-weight:bold; padding:30px; text-align:center; }
    .heading { display:grid; grid-template-columns:1fr auto 1fr; align-items:end; gap:18px; margin-bottom:22px; } .alliance-name { font-size:clamp(1.8rem,4vw,3.3rem); letter-spacing:-.05em; margin:0; } .alliance-name.blue { text-align:right; } .team-list { color:var(--text-gray); font-weight:bold; margin:8px 0 0; } .team-list.blue { text-align:right; } .vs { color:var(--text-gray); font-size:.9rem; font-weight:bold; letter-spacing:.12em; }
    .section-title { border-bottom:3px solid var(--black); font-size:1.35rem; letter-spacing:.05em; margin:46px 0 16px; padding-bottom:10px; text-transform:uppercase; } .comparison-table { background:var(--white); border:2px solid var(--black); border-collapse:collapse; width:100%; }
    .comparison-table th,.comparison-table td { border:1px solid var(--mid-gray); padding:15px 18px; } .comparison-table thead th { background:var(--black); color:var(--white); font-size:.82rem; letter-spacing:.06em; text-transform:uppercase; } .comparison-table th:first-child,.comparison-table td:first-child { text-align:left; }
    .comparison-table td { font-size:1.15rem; font-weight:900; text-align:center; } .comparison-table td:first-child { color:var(--text-gray); font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; } .winner { background:var(--green); }
    .note { color:var(--text-gray); font-size:.9rem; font-weight:bold; margin-top:12px; } .individual-tables,.charts-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px; } .individual-table-card { min-width:0; } .individual-table-card h4 { color:var(--white); font-size:1rem; letter-spacing:.05em; margin:0; padding:14px 18px; text-align:center; text-transform:uppercase; } .individual-table-card.red h4 { background:var(--red); } .individual-table-card.blue h4 { background:var(--cyan); } .individual-table-card .comparison-table { border-top:0; } .chart-card { background:var(--white); border:2px solid var(--black); min-width:0; padding:20px; } .chart-card h4 { font-size:1rem; letter-spacing:.04em; margin:0 0 18px; text-transform:uppercase; } .chart-key { display:flex; font-size:.75rem; font-weight:bold; gap:14px; margin-bottom:12px; text-transform:uppercase; } .chart-key span { align-items:center; display:flex; gap:6px; } .chart-key i { display:inline-block; height:10px; width:10px; } .chart-key .red-key { background:var(--red); } .chart-key .blue-key { background:var(--cyan); } .team-bars { align-items:end; border-bottom:2px solid var(--black); display:flex; gap:8px; height:230px; padding:20px 4px 0; } .team-bar { align-items:center; display:flex; flex:1 1 0; flex-direction:column; height:100%; justify-content:flex-end; min-width:0; } .team-bar-value { font-size:.78rem; font-weight:bold; margin-bottom:6px; white-space:nowrap; } .team-bar-fill { background:var(--red); min-height:3px; width:100%; } .team-bar.blue .team-bar-fill { background:var(--cyan); } .team-bar-label { font-size:.75rem; font-weight:bold; margin-top:8px; overflow:hidden; text-align:center; text-overflow:ellipsis; white-space:nowrap; width:100%; } .chart-empty { align-items:center; color:var(--text-gray); display:flex; font-weight:bold; height:100%; justify-content:center; text-align:center; } @media(max-width:800px) { .controls { grid-template-columns:1fr; } .event-control,.button-row { grid-column:auto; } .team-inputs { grid-template-columns:1fr; } .heading { grid-template-columns:1fr; text-align:center; } .alliance-name.blue,.team-list.blue { text-align:center; } .comparison-table th,.comparison-table td { padding:12px 8px; } .comparison-table td { font-size:1rem; } .individual-tables,.charts-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="top-bar"></div><header><div class="header-content"><div class="eyebrow">MakeShift Robotics • FRC 4039</div><h1>Alliance<br>Comparison</h1><p class="header-description">Enter three teams on each side to compare projected alliance performance from event and scouting data.</p><a class="back-link" href="/">← Back to Scouting Data Hub</a></div></header>
  <main><section class="controls"><div class="control-group event-control"><label for="eventKey">Event</label><select id="eventKey"><option value="2026onham">McMaster</option><option value="2026onosh">Durham College</option><option value="2026onwat">Waterloo</option><option value="2026oncmp2" selected>Provincials Technology Division</option><option value="2026oncmp1">Provincials Science Division</option><option value="2026ontor">Humber</option><option value="2026onwin">Windsor</option></select></div>
    <section class="alliance-inputs red"><h2>Red Alliance</h2><div class="team-inputs"><div class="control-group"><label for="red1">Team 1</label><input id="red1" type="number" placeholder="e.g. 4039"></div><div class="control-group"><label for="red2">Team 2</label><input id="red2" type="number" placeholder="e.g. 1114"></div><div class="control-group"><label for="red3">Team 3</label><input id="red3" type="number" placeholder="e.g. 2056"></div></div></section>
    <section class="alliance-inputs blue"><h2>Blue Alliance</h2><div class="team-inputs"><div class="control-group"><label for="blue1">Team 1</label><input id="blue1" type="number" placeholder="e.g. 5406"></div><div class="control-group"><label for="blue2">Team 2</label><input id="blue2" type="number" placeholder="e.g. 1325"></div><div class="control-group"><label for="blue3">Team 3</label><input id="blue3" type="number" placeholder="e.g. 4678"></div></div></section>
    <div class="button-row"><button id="compareButton">Compare Alliances</button></div></section><div id="results"><div class="empty-state">Enter three teams for each alliance, then select Compare Alliances.</div></div></main>
  <script>
    const eventSelect=document.getElementById('eventKey'); const redInputs=['red1','red2','red3'].map(id=>document.getElementById(id)); const blueInputs=['blue1','blue2','blue3'].map(id=>document.getElementById(id)); const results=document.getElementById('results');
    function escapeHtml(value){return String(value??'—').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));} function format(value,digits=1){return Number.isFinite(value)?value.toFixed(digits):'—';}
    function average(rows,column){const values=rows.filter(row=>String(row['No Show']??'').trim().toUpperCase()!=='TRUE').map(row=>Number(String(row[column]??'').trim())).filter(Number.isFinite);return values.length?values.reduce((sum,value)=>sum+value,0)/values.length:null;} function averageFirst(rows,columns){for(const column of columns){const value=average(rows,column);if(Number.isFinite(value))return value;}return null;} function consistency(rows,column){const values=rows.filter(row=>String(row['No Show']??'').trim().toUpperCase()!=='TRUE').map(row=>Number(row[column])).filter(Number.isFinite);if(values.length<2)return null;const mean=values.reduce((sum,value)=>sum+value,0)/values.length;const variance=values.reduce((sum,value)=>sum+(value-mean)**2,0)/values.length;return Math.max(0,Math.min(100,100*(1-Math.sqrt(variance)/2)));}
    async function fetchJson(url){const response=await fetch(url);const text=await response.text();let data;try{data=JSON.parse(text);}catch{throw new Error(`${url} returned an invalid response.`);}if(!response.ok)throw new Error(data.error||`Could not load ${url}.`);return data;} async function fetchEpa(team,event){try{return await fetchJson(`/api/statbotics/team-event/${team}/${event}`);}catch{return null;}}
    function numberOrNull(value){const number=Number(value);return Number.isFinite(number)?number:null;} function sum(values){const usable=values.filter(Number.isFinite);return usable.length?usable.reduce((total,value)=>total+value,0):null;}
    function profile(teamNumber,data){const eventTeam=data.teams[`frc${teamNumber}`]||{};const rows=data.scouting.filter(row=>String(row['Team Number']??'').trim()===teamNumber);const epa=data.epas[teamNumber];const auto=average(rows,'Auto Scoring Points');const teleop=average(rows,'Teleop Scoring Points');const endgame=averageFirst(rows,['Endgame Scoring Points','End Game Scoring Points','Endgame Points','End Game Points']);return {teamNumber,opr:numberOrNull(eventTeam.opr),dpr:numberOrNull(eventTeam.dpr),ccwm:numberOrNull(eventTeam.ccwm),totalEpa:numberOrNull(epa?.epa?.total_points?.mean),autoEpa:numberOrNull(epa?.epa?.breakdown?.auto_points),teleopEpa:numberOrNull(epa?.epa?.breakdown?.teleop_points),auto,teleop,endgame,total:Number.isFinite(auto)&&Number.isFinite(teleop)&&Number.isFinite(endgame)?auto+teleop+endgame:null,defense:average(rows,'Defense Rating from 1 (incredible) to 5 (poor)'),consistency:consistency(rows,'Defense Rating from 1 (incredible) to 5 (poor)'),reports:rows.length};}
    function alliance(teamNumbers,data){const teams=teamNumbers.map(team=>profile(team,data));const allRows=data.scouting.filter(row=>teamNumbers.includes(String(row['Team Number']??'').trim()));return {teamNumbers,opr:sum(teams.map(team=>team.opr)),totalEpa:sum(teams.map(team=>team.totalEpa)),autoEpa:sum(teams.map(team=>team.autoEpa)),teleopEpa:sum(teams.map(team=>team.teleopEpa)),dpr:sum(teams.map(team=>team.dpr)),ccwm:sum(teams.map(team=>team.ccwm)),auto:sum(teams.map(team=>team.auto)),teleop:sum(teams.map(team=>team.teleop)),endgame:sum(teams.map(team=>team.endgame)),total:sum(teams.map(team=>team.total)),defense:average(allRows,'Defense Rating from 1 (incredible) to 5 (poor)'),consistency:consistency(allRows,'Defense Rating from 1 (incredible) to 5 (poor)'),reports:allRows.length};}
    function row(label,red,blue,{digits=1,lower=false,suffix=''}={}){const redWin=Number.isFinite(red)&&Number.isFinite(blue)&&red!==blue&&(lower?red<blue:red>blue);const blueWin=Number.isFinite(red)&&Number.isFinite(blue)&&red!==blue&&(lower?blue<red:blue>red);return `<tr><td>${label}</td><td class="${redWin?'winner':''}">${format(red,digits)}${Number.isFinite(red)?suffix:''}</td><td class="${blueWin?'winner':''}">${format(blue,digits)}${Number.isFinite(blue)?suffix:''}</td></tr>`;}
    function table(title,red,blue,rows){return `<h3 class="section-title">${title}</h3><table class="comparison-table"><thead><tr><th>Stat</th><th>Red Alliance</th><th>Blue Alliance</th></tr></thead><tbody>${rows.map(args=>row(...args)).join('')}</tbody></table>`;}
    function teamTable(title,color,teams){const metrics=[['OPR','opr',{digits:2}],['Average auto points','auto'],['Average teleop points','teleop'],['Average total points','total'],['Average defense score','defense'],['Defense consistency','consistency',{suffix:'%'}]];return `<article class="individual-table-card ${color}"><h4>${title}</h4><table class="comparison-table"><thead><tr><th>Stat</th>${teams.map(team=>`<th>${escapeHtml(team.teamNumber)}</th>`).join('')}</tr></thead><tbody>${metrics.map(([label,key,options={}])=>`<tr><td>${label}</td>${teams.map(team=>`<td>${format(team[key],options.digits??1)}${Number.isFinite(team[key])?(options.suffix||''):''}</td>`).join('')}</tr>`).join('')}</tbody></table></article>`;}
    function chart(title,redTeams,blueTeams,key,{digits=1,suffix=''}={}){const entries=[...redTeams.map(team=>({...team,color:'red'})),...blueTeams.map(team=>({...team,color:'blue'}))];const values=entries.map(team=>team[key]).filter(Number.isFinite);if(!values.length)return `<article class="chart-card"><h4>${title}</h4><div class="team-bars"><div class="chart-empty">No data is available for these teams.</div></div></article>`;const maximum=Math.max(...values,1);return `<article class="chart-card"><h4>${title}</h4><div class="chart-key"><span><i class="red-key"></i>Red alliance</span><span><i class="blue-key"></i>Blue alliance</span></div><div class="team-bars">${entries.map(team=>{const value=team[key];const height=Number.isFinite(value)?Math.max(3,value/maximum*100):0;return `<div class="team-bar ${team.color}"><span class="team-bar-value">${format(value,digits)}${Number.isFinite(value)?suffix:''}</span>${Number.isFinite(value)?`<div class="team-bar-fill" style="height:${height}%"></div>`:'<div></div>'}<span class="team-bar-label">${escapeHtml(team.teamNumber)}</span></div>`;}).join('')}</div></article>`;}
    function render(red,blue){const redTeams=red.teamNumbers.map(team=>profile(team,currentData));const blueTeams=blue.teamNumbers.map(team=>profile(team,currentData));const charts=[chart('OPR',redTeams,blueTeams,'opr',{digits:2}),chart('Average total points',redTeams,blueTeams,'total'),chart('Average auto points',redTeams,blueTeams,'auto'),chart('Average defense score',redTeams,blueTeams,'defense'),chart('Defense consistency',redTeams,blueTeams,'consistency',{suffix:'%'})].join('');results.innerHTML=`<div class="heading"><div><h2 class="alliance-name">Red Alliance</h2><p class="team-list">${red.teamNumbers.map(escapeHtml).join(' • ')}</p></div><div class="vs">VS</div><div><h2 class="alliance-name blue">Blue Alliance</h2><p class="team-list blue">${blue.teamNumbers.map(escapeHtml).join(' • ')}</p></div></div>${table('Event performance',red,blue,[['Combined OPR',red.opr,blue.opr,{digits:2}],['Combined total EPA',red.totalEpa,blue.totalEpa],['Combined auto EPA',red.autoEpa,blue.autoEpa],['Combined teleop EPA',red.teleopEpa,blue.teleopEpa],['Combined DPR',red.dpr,blue.dpr,{digits:2,lower:true}],['Combined CCWM',red.ccwm,blue.ccwm,{digits:2}]])}${table('Match scouting projection',red,blue,[['Expected auto points',red.auto,blue.auto],['Expected teleop points',red.teleop,blue.teleop],['Expected total points',red.total,blue.total],['Average defense rating',red.defense,blue.defense,{lower:true}],['Defense consistency',red.consistency,blue.consistency,{suffix:'%'}],['Scouting reports',red.reports,blue.reports,{digits:0}]])}<h3 class="section-title">Individual team comparison</h3><section class="individual-tables">${teamTable('Red alliance','red',redTeams)}${teamTable('Blue alliance','blue',blueTeams)}</section><h3 class="section-title">Individual team charts</h3><section class="charts-grid">${charts}</section><p class="note">Scouting total points = average auto + average teleop + average endgame. Defense ratings are shown as recorded (1 is strongest, 5 is weakest); consistency is calculated from defense-rating variation.</p>`;}
    let currentData={teams:{},scouting:[],epas:{}}; async function compare(){const red=redInputs.map(input=>input.value.trim());const blue=blueInputs.map(input=>input.value.trim());if([...red,...blue].some(value=>!value)){results.innerHTML='<div class="empty-state">Enter all six team numbers.</div>';return;}if(new Set([...red,...blue]).size!==6){results.innerHTML='<div class="empty-state">Each alliance must use three different teams.</div>';return;}results.innerHTML='<div class="loading">Loading alliance comparison…</div>';try{const event=eventSelect.value;const [stats,scouting,...epas]=await Promise.all([fetchJson(`/api/events/${event}/oprs`),fetchJson(`/api/scouting/${event}`),...([...red,...blue].map(team=>fetchEpa(team,event)))]);const teams={};for(const [key,opr] of Object.entries(stats.oprs||{}))teams[key]={opr,dpr:stats.dprs?.[key],ccwm:stats.ccwms?.[key]};const epaMap=Object.fromEntries([...red,...blue].map((team,index)=>[team,epas[index]]));currentData={teams,scouting,epas:epaMap};render(alliance(red,currentData),alliance(blue,currentData));}catch(error){results.innerHTML=`<div class="empty-state">Could not load alliance comparison: ${escapeHtml(error.message)}</div>`;}}
    document.getElementById('compareButton').addEventListener('click',compare);[...redInputs,...blueInputs].forEach(input=>input.addEventListener('keydown',event=>{if(event.key==='Enter')compare();}));
  </script>
</body>
</html>
