<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compare Teams | MakeShift Scouting Data Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="compare.css" />
  </head>
  <body>
    <div class="top-bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <header>
      <div class="header-content">
        <a class="brand" href="/"><img src="/images/makeshift-logo-wide.png" alt="MakeShift 4039" width="707" height="78"></a>
        <div class="eyebrow">Analysis</div>
        <h1>Team<br />Comparison</h1>
        <p class="header-description">
          Compare two teams’ event performance, scouting results, and pit
          information side by side.
        </p>
        <div class="header-links"><a class="back-link" href="/">← Data Hub</a></div>
      </div>
    </header>
    <main>
      <section class="controls">
        <div class="control-group">
          <label for="eventKey">Event</label
          ><select id="eventKey">
            <option value="2026onham">McMaster</option>
            <option value="2026onosh">Durham College</option>
            <option value="2026onwat">Waterloo</option>
            <option value="2026oncmp2" selected>
              Provincials Technology Division
            </option>
            <option value="2026oncmp1">Provincials Science Division</option>
            <option value="2026ontor">Humber</option>
            <option value="2026onwin">Windsor</option>
          </select>
        </div>
        <div class="control-group">
          <label for="teamA">Team A</label
          ><input
            id="teamA"
            type="number"
            inputmode="numeric"
            placeholder="e.g. 4039"
          />
        </div>
        <div class="control-group">
          <label for="teamB">Team B</label
          ><input
            id="teamB"
            type="number"
            inputmode="numeric"
            placeholder="e.g. 1114"
          />
        </div>
        <button id="compareButton">Compare</button>
      </section>
      <div id="results">
        <div class="empty-state">
          Choose an event, enter two team numbers, then select Compare.
        </div>
      </div>
    </main>
  <script src="../utils.js"></script>
    <script src="compare.js"></script>
  </body>
</html>
