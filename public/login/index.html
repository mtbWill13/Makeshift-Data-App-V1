<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Login | MakeShift Scouting Data Hub</title>
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/team.css">
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="top-bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <main class="login-page">
      <a class="brand" href="/login/"><img src="/images/makeshift-logo-wide.png" alt="MakeShift 4039" width="707" height="78"></a>

      <form id="loginForm" class="login-card" novalidate>
        <div class="eyebrow">Team access</div>
        <h1>Log in</h1>
        <p class="login-note">Log in to your team's scouting data.</p>

        <div class="control-group">
          <label for="team">Team number</label>
          <input id="team" name="team" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="username" placeholder="e.g. 4039" required>
        </div>

        <div class="control-group">
          <label for="password">Team password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
        </div>

        <p id="message" class="login-message" role="alert" aria-live="assertive"></p>
        <button id="submit" type="submit">Log in</button>
      </form>

      <div class="signup-prompt">
        <span>Is your team new here?</span>
        <a id="signupLink" class="signup-button" href="/signup/">Create a team account</a>
      </div>
    </main>
    <script src="login.js"></script>
  </body>
</html>
